[project]
name = "hrot"
version = "0.1.0"
description = "HRoT Carbon Verification Module: measured, controlled and cryptographically attested energy savings (simulation)."
readme = "README.md"
requires-python = "==3.12.*"  # canonical toolchain: AGENTS.md + CI (3.12)
dependencies = [
    "numpy>=1.26",
    "pynacl>=1.5",
    "cryptography>=42",
    "cocotb>=2.0",
    "cocotb-test>=0.2.5",
    "pytest>=8",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tb", "tests"]
python_files = ["test_*.py"]
markers = [
    "slow: long-running sim nodes (excluded from make test, run in test-full)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["rtl/third_party/"]  # vendored upstream (secworks): never lint, never modify

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/test_third_party_manifest.py" = ["E501"]  # fixed-width digest table (data, not code)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plant", "sensors", "edge", "control", "baseline", "ledger", "attacks", "cosim", "dashboard"]
