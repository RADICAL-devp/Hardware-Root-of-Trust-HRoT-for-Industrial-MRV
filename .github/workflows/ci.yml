name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog (apt, expect >= 12)
        run: |
          sudo apt-get update && sudo apt-get install -y iverilog
          iverilog -V
      - name: Cache Verilator 5.048 build
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: ~/verilator-5.048
          # Pinned exact: cocotb 2.x needs Verilator 5.x (--trace-fst);
          # 5.048 is the locally proven version. Rebuild on miss.
          key: verilator-5.048-${{ runner.os }}
      - name: Build Verilator 5.048 from tarball
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y git make autoconf g++ flex bison \
            libfl2 libfl-dev help2man
          curl -L https://github.com/verilator/verilator/archive/refs/tags/v5.048.tar.gz \
            | tar -xz -C /tmp
          cd /tmp/verilator-5.048 && autoconf && ./configure --prefix=$HOME/verilator-5.048 \
            && make -j$(nproc) && make install
      - name: Use pinned Verilator
        # NOTE: $GITHUB_PATH takes effect only in LATER steps, so this
        # step calls the binary by full path (and re-exports PATH inline).
        run: |
          export PATH="$HOME/verilator-5.048/bin:$PATH"
          echo "$HOME/verilator-5.048/bin" >> $GITHUB_PATH
          verilator --version
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync
      - name: Lint
        run: make lint
      - name: Test (fast subset)
        # Tee the log: the Report step below surfaces failures as
        # check-run annotations (publicly readable without auth).
        run: make test 2>&1 | tee /tmp/pytest_fast.log; test ${PIPESTATUS[0]} -eq 0
      - name: Report test outcome
        # Always runs: emits up to 10 ::error:: annotations (one per failed
        # node) plus a totals notice, so failures are diagnosable from the
        # checks API without fetching logs.
        if: always()
        run: |
          python3 - <<EOF
          import re
          try:
              log = open("/tmp/pytest_fast.log", errors="replace").read()
          except FileNotFoundError:
              print("::error::pytest log missing (test step never ran)")
              raise SystemExit(0)
          fails = re.findall(r"^FAILED (\S+?)( - .*)?$", log, re.M)
          total = re.findall(r"^(\d+) (passed|failed)", log, re.M)
          print(f"::notice::fast subset: {len(fails)} failed node(s)")
          for node, _ in fails[:10]:
              print(f"::error::{node}")
          flaky = re.findall(r"^(FLAKY-INFRA-PASS \S+ \[.*?\]):", log, re.M)
          for line in flaky[:10]:
              print(f"::warning::{line} (infra crash, passed on retry)")
          tail = "\n".join(log.splitlines()[-15:])
          print("::notice::tail follows in job summary")
          with open("$GITHUB_STEP_SUMMARY", "a") as f:
              f.write("```\n" + tail[-3000:] + "\n```\n")
          EOF
