name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync
      - name: Lint
        run: make lint

  test:
    # One job per test file: failures attribute to files without any log
    # access, slow/hung files cannot block others, and wall time drops to
    # the slowest file (~10 min) instead of the whole suite serially.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - tb/test_hello.py
          - tb/test_week4b_lutparam.py
          - tb/test_week4b_record.py
          - tb/test_week4b_uart.py
          - tb/test_week4b_zc.py
          - tb/test_week5a_frame.py
          - tb/test_week5b_divsqrt.py
          - tb/test_week5b_power.py
          - tests
    steps:
      - uses: actions/checkout@v4
      - name: Install Icarus Verilog (apt, expect >= 12)
        run: |
          sudo apt-get update && sudo apt-get install -y iverilog ccache
          iverilog -V
          ccache --version | head -1
      - name: Cache ccache (Verilator model objects, content-addressed)
        # Why ccache and not sim_build/: ccache keys on content, so it is
        # correct by construction across checkouts (make/mtime caching
        # would always rebuild against fresh checkouts). Rationale recorded.
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-verilator-5.048
      - name: Route compilers through ccache
        # Symlinks (not CC/CXX env): Verilator-generated Makefiles set
        # their own compiler variables, but every gcc/g++ argv still hits
        # the shim. First run populates (~build time), later runs hit.
        run: |
          mkdir -p ~/ccbin
          ln -sf "$(command -v ccache)" ~/ccbin/gcc
          ln -sf "$(command -v ccache)" ~/ccbin/g++
          ln -sf "$(command -v ccache)" ~/ccbin/cc
          ln -sf "$(command -v ccache)" ~/ccbin/c++
          echo "$HOME/ccbin" >> $GITHUB_PATH
          export CCACHE_MAXSIZE=3G
          echo "CCACHE_MAXSIZE=3G" >> $GITHUB_ENV
          ccache --zero-stats
      - name: Cache Verilator 5.048 build
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: ~/verilator-5.048
          # Pinned exact: cocotb 2.x needs Verilator 5.x (--trace-fst);
          # 5.048 is the locally proven version. Rebuild on miss.
          key: verilator-5.048-${{ runner.os }}
      - name: Build Verilator 5.048 from tarball
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y git make autoconf g++ flex bison \
            libfl2 libfl-dev help2man
          curl -L https://github.com/verilator/verilator/archive/refs/tags/v5.048.tar.gz \
            | tar -xz -C /tmp
          cd /tmp/verilator-5.048 && autoconf && ./configure --prefix=$HOME/verilator-5.048 \
            && make -j$(nproc) && make install
      - name: Use pinned Verilator
        # NOTE: $GITHUB_PATH takes effect only in LATER steps, so this
        # step calls the binary by full path (and re-exports PATH inline).
        run: |
          export PATH="$HOME/verilator-5.048/bin:$PATH"
          echo "$HOME/verilator-5.048/bin" >> $GITHUB_PATH
          verilator --version
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync
      - name: Test ${{ matrix.target }} (fast subset)
        # Per-file step: hangs/failures attribute to files via step status
        # alone (no annotations needed); a stuck file cannot block others.
        timeout-minutes: 30
        run: >
          uv run pytest "${{ matrix.target }}" -m "not slow" -v
          --durations=10 2>&1 | tee /tmp/pytest_one.log;
          test ${PIPESTATUS[0]} -eq 0
      - name: Report ${{ matrix.target }}
        if: always()
        run: |
          python3 - <<EOF
          import re
          try:
              log = open("/tmp/pytest_one.log", errors="replace").read()
          except FileNotFoundError:
              print("::error::pytest log missing (test step never ran)")
              raise SystemExit(0)
          roots = re.findall(
              r"AssertionError: (?!test_\w+ \[.+?\] FAILED)(.+)", log
          )
          seen = []
          for r in roots:
              r = r.strip()[:160]
              if r not in seen:
                  seen.append(r)
          for n, r in enumerate(seen[:5]):
              print(f"::error::root {n + 1}: {r}")
          fails = re.findall(r"^FAILED (\S+?)( - .*)?$", log, re.M)
          if fails:
              body = " || ".join(f"{c}{r[:140]}" for c, r in fails[:8])
              print(f"::error::failed({len(fails)}): {body}")
          errs = re.findall(r"^(ERROR \S+)", log, re.M)
          if errs:
              print(f"::error::error nodes: {' || '.join(errs[:10])}")
          flaky = re.findall(r"^(FLAKY-INFRA-PASS \S+ \[.*?\]):", log, re.M)
          for line in flaky[:5]:
              print(f"::warning::{line} (infra crash, passed on retry)")
          EOF
      - name: ccache stats (compilation cache effectiveness)
        if: always()
        run: |
          export PATH="$HOME/ccbin:$PATH"
          ccache --show-stats || true
